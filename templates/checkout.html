{% extends 'base.html' %}

{% block title %}
Checkout | ShopEase
{% endblock %}

{% block content %}

<style>

    /* ================= CHECKOUT PAGE ================= */

    .checkout-page {
        min-height: 70vh;
        padding: 45px 20px 60px;
    }


    .checkout-header {
        text-align: center;
        margin-bottom: 30px;
    }


    .checkout-header h1 {
        margin: 0 0 8px;

        color: #111827;

        font-size: 34px;
    }


    .checkout-header p {
        margin: 0;

        color: #777;

        font-size: 15px;
    }


    /* ================= CHECKOUT CARD ================= */

    .checkout-container {
        width: 90%;
        max-width: 650px;

        margin: auto;

        background: white;

        padding: 35px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.08);
    }


    .checkout-title {
        display: flex;
        align-items: center;

        gap: 10px;

        margin-bottom: 25px;

        padding-bottom: 15px;

        border-bottom: 1px solid #eeeeee;
    }


    .checkout-title i {
        color: #ff4d6d;

        font-size: 22px;
    }


    .checkout-title h2 {
        margin: 0;

        color: #111827;

        font-size: 22px;
    }


    /* ================= FORM ================= */

    .form-group {
        margin-bottom: 18px;
    }


    .form-group label {
        display: block;

        margin-bottom: 7px;

        color: #333;

        font-size: 14px;

        font-weight: 600;
    }


    .form-group label i {
        color: #ff4d6d;

        margin-right: 5px;
    }


    .form-group input,
    .form-group textarea {
        width: 100%;

        padding: 12px 14px;

        border: 1px solid #dddddd;

        border-radius: 7px;

        outline: none;

        font-family: Arial, sans-serif;

        font-size: 14px;

        background: #fafafa;

        transition: 0.3s;

        resize: vertical;
    }


    .form-group input {
        height: 45px;
    }


    .form-group textarea {
        min-height: 100px;
    }


    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #ff4d6d;

        background: white;

        box-shadow:
            0 0 0 3px rgba(255, 77, 109, 0.08);
    }


    /* ================= TWO COLUMN ================= */

    .form-row {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 15px;
    }


    /* ================= PAYMENT INFO ================= */

    .payment-info {
        display: flex;
        align-items: center;

        gap: 10px;

        margin: 25px 0;

        padding: 13px 15px;

        background: #fff5f7;

        border: 1px solid #ffe0e6;

        border-radius: 8px;

        color: #555;

        font-size: 13px;
    }


    .payment-info i {
        color: #ff4d6d;

        font-size: 18px;
    }


    /* ================= PLACE ORDER ================= */

    .place-order-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 8px;

        background: #ff4d6d;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }


    .place-order-btn:hover {
        background: #e6395c;

        transform: translateY(-2px);

        box-shadow:
            0 7px 15px rgba(255, 77, 109, 0.25);
    }


    .place-order-btn i {
        margin-right: 7px;
    }


    /* ================= SECURITY ================= */

    .secure-checkout {
        text-align: center;

        margin-top: 18px;

        color: #777;

        font-size: 12px;
    }


    .secure-checkout i {
        color: #28a745;

        margin-right: 5px;
    }


    /* ================= RESPONSIVE ================= */

    @media (max-width: 600px) {

        .checkout-page {
            padding: 30px 10px 50px;
        }


        .checkout-container {
            width: 95%;

            padding: 25px 20px;
        }


        .checkout-header h1 {
            font-size: 28px;
        }


        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

    }

</style>


<!-- ================= CHECKOUT PAGE ================= -->

<div class="checkout-page">


    <!-- Header -->

    <div class="checkout-header">

        <h1>
            🛍️ Checkout
        </h1>

        <p>
            Enter your details to complete your order.
        </p>

    </div>


    <!-- Checkout Form -->

    <div class="checkout-container">


        <div class="checkout-title">

            <i class="fas fa-location-dot"></i>

            <h2>
                Delivery Information
            </h2>

        </div>


        <form method="POST">

            {% csrf_token %}


            <!-- Full Name -->

            <div class="form-group">

                <label>
                    <i class="fas fa-user"></i>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Address -->

            <div class="form-group">

                <label>
                    <i class="fas fa-house"></i>
                    Address
                </label>

                <textarea
                    name="address"
                    placeholder="Enter your complete address"
                    required
                ></textarea>

            </div>


            <!-- City + Pincode -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        <i class="fas fa-city"></i>
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        <i class="fas fa-map-pin"></i>
                        Pincode
                    </label>

                    <input
                        type="text"
                        name="pincode"
                        placeholder="Enter pincode"
                        maxlength="6"
                        required
                    >

                </div>

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label>
                    <i class="fas fa-phone"></i>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- Payment Information -->

            <div class="payment-info">

                <i class="fas fa-shield-halved"></i>

                <span>
                    Your order details are safe and secure.
                </span>

            </div>


            <!-- Place Order -->

            <button
                type="submit"
                class="place-order-btn"
            >

                <i class="fas fa-check"></i>

                Place Order

            </button>


            <!-- Secure -->

            <div class="secure-checkout">

                <i class="fas fa-lock"></i>

                Secure Checkout

            </div>

        </form>

    </div>

</div>

{% endblock %}
